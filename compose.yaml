services:
  postgres:
    image: postgres:17-alpine
    container_name: reporting-portal-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reporting_portal}
      POSTGRES_USER: ${POSTGRES_USER:-reporting_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reporting_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - reporting-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  reporting-postgres-data:
