services:
  postgres:
    image: postgres:17-alpine
    container_name: reporting-portal-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reporting_portal}
      POSTGRES_USER: ${POSTGRES_USER:-reporting_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reporting_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - reporting-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reporting-portal-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-reporting_portal}
      DB_USERNAME: ${POSTGRES_USER:-reporting_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-reporting_password}
      DB_MIGRATION_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-reporting_portal}
      DB_MIGRATION_USERNAME: ${POSTGRES_USER:-reporting_user}
      DB_MIGRATION_PASSWORD: ${POSTGRES_PASSWORD:-reporting_password}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

volumes:
  reporting-postgres-data:
